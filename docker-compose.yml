services:
  ductile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ductile-test
    restart: unless-stopped

    # Mount the example config FOLDER (split-file layout; see docs/BOOTSTRAP.md
    # for genesis — the vault files must exist in the mounted dir before boot).
    volumes:
      - ./config:/app/config:ro
      - ./plugins:/app/plugins:ro
      - ductile-data:/app/data
      - ./logs:/app/logs

    # Environment variables for test
    env_file:
      - .env.test

    environment:
      - CONFIG_PATH=/app/config

    # Expose API port
    ports:
      - "9001:8080"

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "test", "-f", "/app/ductile.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ductile-data:
    driver: local
