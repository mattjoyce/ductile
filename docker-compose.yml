services:
  ductile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ductile-test
    restart: unless-stopped

    # Mount the example config FOLDER (split-file layout; see docs/BOOTSTRAP.md
    # for genesis — the vault files must exist in the mounted dir before boot).
    # The repo plugins/ overlays the config's relative "plugins" root.
    volumes:
      - ./config:/app/config:ro
      - ./plugins:/app/config/plugins:ro
      - ductile-data:/app/data
      - ./logs:/app/logs

    # Environment variables for test
    env_file:
      - .env.test

    environment:
      # Config discovery env var (the binary reads DUCTILE_CONFIG_DIR).
      - DUCTILE_CONFIG_DIR=/app/config

    # Expose API port. The example api.yaml binds loopback 127.0.0.1:8081 —
    # to reach the gateway from the host, set api.listen to "0.0.0.0:8081".
    ports:
      - "9001:8081"

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check — the real liveness endpoint (see Dockerfile HEALTHCHECK note).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ductile-data:
    driver: local
