# Example plugins configuration
#
# Plugins ship SEPARATELY (the ductile-plugins repo) — this file is a commented
# template: install a plugin under a plugin_root, then uncomment its entry.
# An empty map is valid; the gateway boots with zero plugins.
plugins: {}
#
# Per-plugin timeouts and retries use the nested shape that PluginConf actually
# decodes: `timeouts:` (poll/handle/health/init, Go durations) and
# `retry: {max_attempts}`. The flat `timeout:`/`max_attempts:` keys some earlier
# examples used are NOT PluginConf fields — they were silently dropped at load.
# A single operator-facing duration maps to both core lifecycle commands
# (poll + handle); set them independently if a plugin needs different values.
# plugins:
#   fabric:
#     enabled: true
#     timeouts:
#       poll: 120s
#       handle: 120s
#     retry:
#       max_attempts: 2
#     config:
#       FABRIC_DEFAULT_PATTERN: "summarize"

#   file_handler:
#     enabled: true
