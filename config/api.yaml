# Example API configuration — BOOTSTRAP state (see docs/BOOTSTRAP.md).
#
# No api.auth.tokens yet: with a vault present, the daemon boots the management
# posture and serves /vault/* on the management socket so you can MINT the
# first token (literal token values are rejected — API secrets are vault-only).
api:
  enabled: true
  listen: "127.0.0.1:8081"
  management_socket: "/tmp/ductile-admin.sock" # short path; default sits beside the state DB

