log_level: info
service:
  strict_mode: false
  unconfined: true
state:
  path: "./state/ductile.db"
# run.sh rewrites this relative path to an absolute $ROOT_DIR/plugins (the shared
# echo plugin) when it copies the config into a throwaway work dir.
plugin_roots:
  - "../../../../../plugins"
secrets:
  age_key_file: "age.key"
  vault_file: "vault.age"
include:
  - api.yaml
  - plugins.yaml
