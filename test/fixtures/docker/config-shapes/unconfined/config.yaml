# config-shapes case 3: service.unconfined: true (every other fixture's
# hygiene shape). The gateway runs plugins at its own uid and logs the override.
service:
  name: config-shapes-unconfined
  tick_interval: 1s
  unconfined: true
  admission:
    verify_integrity_on_boot: true
    fail_on_drift: true
    validate_config_on_boot: true
state:
  path: "./state/ductile.db"
plugin_roots:
  - "./plugins"
secrets:
  age_key_file: "age.key"
  vault_file: "vault.age"
include:
  - api.yaml
  - plugins.yaml
