name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run fast tests
        run: ./scripts/test-fast

      # Privsep negative-test gate (#90). The privileged tests skip as a non-root
      # user (which is how ./scripts/test-fast runs them — a skip is never a pass),
      # so run them explicitly under sudo where they actually drop privilege and the
      # wall is exercised. Worker uids are numeric, so no account provisioning needed.
      - name: Privsep negative suite (privileged gate)
        run: |
          go test -c -o /tmp/dispatch.test ./internal/dispatch/
          sudo /tmp/dispatch.test -test.v -test.run \
            'TestPrivsepWorkerCannotReadAgeKey|TestPrivsepNegativeSuite|TestReconcileWorkerFilesystemAsRoot|TestHasDropCapabilityAsRoot|TestBindWorkerToFingerprint|TestEvaluateBootGate|TestResolveWorker|TestApplyWorkerCredential|TestValidateWorkers'

      - name: Run lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  docker-validation:
    runs-on: ubuntu-latest
    needs: fast-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install jq and sqlite3
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3

      - name: Build ductile binary
        run: make build

      - name: Run Docker-backed staged tests
        run: |
          ./scripts/test-docker api-e2e
          ./scripts/test-docker scheduler-recovery
          ./scripts/test-docker webhook-ingress

      - name: Upload Docker test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-artifacts
          path: test-artifacts/docker
          if-no-files-found: ignore
