manifest_spec: ductile.plugin
manifest_version: 1
name: restic_backup
version: 0.1.0
protocol: 2
entrypoint: run.sh
concurrency_safe: false
description: "Runs `restic backup` of configured source paths to a rest-server repo. Driven by the `poll` command on a nightly cron. Secrets (repo URL with creds + repo password) are sourced from a chmod-600 env_file named in config — never passed through job baggage. Falls back to a secondary repo URL (Wi-Fi address) when the primary (2.5GbE wire) is unreachable. Credentials are stripped from all emitted logs. `health` checks repo reachability + credential validity via `restic cat config`."
commands:
  - name: poll
    type: write
    description: "Scheduled backup. Runs `restic backup <paths>` with the configured excludes, tags the snapshot, and pins --host so parent-snapshot reuse survives hostname drift. Returns the restic summary in result/logs."
    idempotent: false
    retry_safe: true
    input_schema:
      type: object
      additionalProperties: true
    output_schema:
      type: object
      properties:
        status: {type: string, enum: [ok, error]}
        result: {type: string}
        events: {type: array}
        error: {type: string}
        retry: {type: boolean}
        logs: {type: array, items: {type: object}}
      required: [status, logs]
      additionalProperties: false
    values:
      consume: []
      emit: []
  - name: health
    type: read
    description: "Repo reachability + credential check via `restic cat config`. Tries the primary repo, then the fallback."
    idempotent: true
    retry_safe: true
    input_schema:
      type: object
      additionalProperties: true
    output_schema:
      type: object
      properties:
        status: {type: string, enum: [ok, error]}
        result: {type: string}
        events: {type: array}
        error: {type: string}
        retry: {type: boolean}
        logs: {type: array, items: {type: object}}
      required: [status, logs]
      additionalProperties: false
    values:
      consume: []
      emit: []
config_keys:
  required:
    - env_file
    - paths
  optional:
    - excludes
    - host
    - tag
