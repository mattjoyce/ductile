# /etc/tmpfiles.d/ductile-accounts.conf — privsep account dirs (PrivSec ADR §5, card #87/#88).
#
# The init layer provisions each account's private 0700 state_dir owned by the
# account — because a cap-only gateway (CAP_SETUID+CAP_SETGID, no CAP_CHOWN) cannot
# chown them itself; it only verifies (fail-closed). Apply with:
#   systemd-tmpfiles --create /etc/tmpfiles.d/ductile-accounts.conf
#
# Must match the uids/state_dirs in the config `accounts:` map and the sysusers file.
#
# Type Path                                Mode UID                GID                Age Arg
d     /var/lib/ductile                     0700 ductile            ductile            -   -
d     /var/lib/ductile/accounts             0755 ductile            ductile            -   -
d     /var/lib/ductile/accounts/default     0700 ductile-default    ductile-default    -   -
d     /var/lib/ductile/accounts/untrusted   0700 ductile-untrusted  ductile-untrusted  -   -
# Runtime dir (pid/sockets) — boot-recreated on tmpfs (ADR filesystem-layout).
d     /run/ductile                          0700 ductile            ductile            -   -
