# /etc/tmpfiles.d/ductile-workers.conf — privsep worker dirs (PrivSec ADR §5, card #87/#88).
#
# The init layer provisions each worker's private 0700 state_dir owned by the
# worker — because a cap-only gateway (CAP_SETUID+CAP_SETGID, no CAP_CHOWN) cannot
# chown them itself; it only verifies (fail-closed). Apply with:
#   systemd-tmpfiles --create /etc/tmpfiles.d/ductile-workers.conf
#
# Must match the uids/state_dirs in the config `workers:` map and the sysusers file.
#
# Type Path                                Mode UID                GID                Age Arg
d     /var/lib/ductile                     0700 ductile            ductile            -   -
d     /var/lib/ductile/workers             0755 ductile            ductile            -   -
d     /var/lib/ductile/workers/default     0700 ductile-default    ductile-default    -   -
d     /var/lib/ductile/workers/untrusted   0700 ductile-untrusted  ductile-untrusted  -   -
