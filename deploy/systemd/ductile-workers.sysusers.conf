# /etc/sysusers.d/ductile-workers.conf — privsep accounts (PrivSec ADR §5 Q4).
#
# Stable uids, created by the deploy layer (NOT by the daemon at runtime) — the
# postgres/sshd/nginx pattern. Apply with:  systemd-sysusers
#
# Type Name              ID    GECOS                       Home              Shell
u     ductile            984   "Ductile gateway"           /var/lib/ductile  /usr/sbin/nologin
u     ductile-default    1001  "Ductile default worker"    -                 /usr/sbin/nologin
u     ductile-untrusted  1002  "Ductile untrusted worker"  -                 /usr/sbin/nologin
